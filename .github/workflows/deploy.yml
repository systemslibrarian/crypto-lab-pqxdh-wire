name: Build, verify, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per-ref, so a pull request run can never cancel a live main deploy.
  group: pages-${{ github.ref }}
  # Cancel superseded PR runs only. A deploy-bearing run must never be cancelled:
  # two Dependabot auto-merges landing seconds apart each dispatch a run into this
  # group, and with unconditional cancel-in-progress the earlier one is killed
  # mid-deploy. That happened here on 2026-09-11 — run 34642424003 was cancelled
  # five seconds before 34642430702 started, and neither shipped. A `cancelled`
  # run is one of the two shapes that hid the 2026-08-20 fleet-wide staleness,
  # because it reads as "a run existed" while nothing was published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every rendered verdict on the page carries data-verdict, every marker is
  # covered by a recorded mutation, and nothing renders an outcome outside a
  # marker. This is its own job so it is its own check, and so it can be a
  # REQUIRED status check on main: a check that runs but cannot block anything
  # is decoration. Auto-merge waits only on required checks, and deploy below
  # waits on this job by `needs:`, which also covers a direct push to main —
  # the path that skips pull-request checks entirely.
  verdict-gate:
    name: verdict-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # CI is set by Actions, so playwright.config.ts turns off
      # reuseExistingServer and the suite can only hit a server built from this
      # checkout. A reused or shared-port server makes a real kill look like a
      # survivor, and this lab's port (4700) is pinned in the catalog's
      # playwright-ports.json.
      - name: Verdict coverage and per-marker verdicts
        run: npm run test:verdicts

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # configure-pages@v6 enables Pages on first use and needs these. With
      # `contents: read` alone it 403s — the exact step that failed here on
      # 2026-09-11, on a job whose own permissions block said nothing about it.
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and correctness tests
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility and claims gate
        run: npm run test:a11y
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, verdict-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [build, verdict-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Read Dependabot metadata
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose gate passed and dispatch deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for attempt in 1 2 3; do
            gh pr merge --squash --delete-branch "$PR_URL" && merged=1 && break
            sleep 15   # a sibling PR merging first moves main under us
          done
          # Fail loudly. `exit 0` here leaves a green job, an open PR with a passing
          # gate, and an annotation nobody reads — structurally the same swallow that
          # hid four separate non-deploy bugs across the fleet on 2026-08-20.
          [[ -n "$merged" ]] || { echo "::error::gate passed but the merge did not land after 3 attempts"; exit 1; }
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
